<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Singularity Engine 1</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="viewport"></canvas>
  <div id="ui-root" class="ui-root">
    <div class="title">Singularity Engine 1</div>
    <div class="subtitle">Runtime galaxy generator — WASD to fly</div>
    <button id="genBtn">Generate Sector 0,0,0</button>
    <div id="status">idle</div>
    <div style="margin-top:8px;font-size:11px;color:#9ca3af">
      Controls: <strong>W A S D</strong> move, <strong>Q/E</strong> up/down.
    </div>
  </div>

  <script type="module">
    import { bootstrap } from "./Bootstrap.js";
    const engine = bootstrap();
    window.engine = engine;

    const btn = document.getElementById("genBtn");
    const status = document.getElementById("status");

    btn?.addEventListener("click", async () => {
      status.textContent = "requesting backend...";
      try {
        const res = await fetch("/api/galaxy/sector?sectorId=0,0,0");
        const json = await res.json();
        status.textContent = "generating...";
        engine.galaxyManager.generateSector(json.seed, json.sectorId);
        status.textContent = "done";
      } catch (err) {
        status.textContent = "error";
        console.error(err);
      }
    });
  </script>
</body>
</html>
