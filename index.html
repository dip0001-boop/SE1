<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Singularity Engine Editor</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="editor-root" class="editor-root">
    <header class="topbar">
      <div class="brand">Singularity Engine</div>
      <div class="toolbar">
        <button id="btn-play">Play</button>
        <button id="btn-save">Save</button>
        <button id="btn-load">Load</button>
        <select id="gizmo-mode">
          <option value="translate">Translate</option>
          <option value="rotate">Rotate</option>
          <option value="scale">Scale</option>
        </select>
      </div>
    </header>

    <aside class="leftpanel">
      <div class="panel-title">Scene</div>
      <div id="scene-tree" class="scene-tree"></div>
    </aside>

    <main class="viewport-panel">
      <canvas id="viewport"></canvas>
      <div class="viewport-overlay">
        <div id="fps" class="fps">FPS: --</div>
      </div>
    </main>

    <aside class="rightpanel">
      <div class="panel-title">Inspector</div>
      <div id="inspector" class="inspector"></div>
    </aside>
  </div>

  <script type="module">
    import { bootstrapEditor } from "./editor.js";
    bootstrapEditor();
  </script>
</body>
</html>
